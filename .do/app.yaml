# DigitalOcean App Platform spec — static site, auto-deploy on push to main.
# Apply with:  doctl apps create --spec .do/app.yaml
# Or create the app in the DO dashboard and point it at this repo; the settings
# below are what the dashboard form asks for.
name: rartist
region: fra
static_sites:
  - name: rartist-web
    github:
      repo: iovmada/rartist
      branch: main
      deploy_on_push: true
    # No build step — the repo root is the document root.
    source_dir: /
    output_dir: /
    index_document: index.html
    error_document: 404.html
